name: MCP Release

on:
  push:
    tags:
      - 'mcp-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: macos-13
            target: darwin-x64
          - os: macos-latest
            target: darwin-arm64
          - os: windows-latest
            target: windows-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build binary
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == windows* ]]; then
            bun build --compile --outfile="dist/skim-mcp-${{ matrix.target }}.exe" src/index.ts
          else
            bun build --compile --outfile="dist/skim-mcp-${{ matrix.target }}" src/index.ts
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: skim-mcp-${{ matrix.target }}
          path: dist/skim-mcp-*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: skim-mcp-*

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
